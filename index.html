<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>江河美好咖啡 Riverfront Coffee ☕</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">☕ HelloCoffee</div>
    <nav>
      <a href="#menu">菜单</a>
      <a href="#orders">订单</a>
      <a href="#about">关于</a>
    </nav>
    <button id="cartButton" class="cart-button">🛒 <span id="cartCount">0</span></button>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">GOOD COFFEE · GOOD DAY</p>
        <h1>今天，来一杯<br><span>属于你的咖啡。</span></h1>
        <p class="hero-text">新鲜现磨咖啡，简单点单，快乐马上到来。</p>
        <a class="primary-button" href="#menu">开始点单 ☕</a>
      </div>
      <div class="hero-cup">☕</div>
    </section>

    <section id="menu" class="section">
      <div class="section-title">
        <div>
          <p class="eyebrow">OUR MENU</p>
          <h2>今日咖啡</h2>
        </div>
        <span id="menuHint">选择你喜欢的咖啡</span>
      </div>
      <div id="menuGrid" class="menu-grid"></div>
    </section>

    <section id="orders" class="section order-section">
      <div class="section-title">
        <div>
          <p class="eyebrow">ORDER</p>
          <h2>最近订单</h2>
        </div>
      </div>
      <div id="orderHistory" class="orders-empty">还没有订单。点一杯咖啡吧 ☕</div>
    </section>

    <section id="about" class="about">
      <div>
        <p class="eyebrow">HELLOCOFFEE</p>
        <h2>小店 · 好咖啡 · 好心情</h2>
      </div>
      <p>这是， 前端测试版 V1.0 Beta。连接后端服务器后，变成真正的咖啡店经营系统。</p>
    </section>
  </main>

  <aside id="cartPanel" class="cart-panel">
    <div class="cart-header">
      <h2>🛒 我的购物车</h2>
      <button id="closeCart" class="icon-button">×</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-footer">
      <div class="total-row"><span>合计</span><strong id="cartTotal">$0.00</strong></div>
      <button id="checkoutButton" class="checkout-button">确认下单</button>
    </div>
  </aside>

  <div id="overlay" class="overlay"></div>

  <div id="successModal" class="modal hidden">
    <div class="modal-card">
      <div class="success-icon">✓</div>
      <p class="eyebrow">ORDER CONFIRMED</p>
      <h2>下单成功！</h2>
      <p>您的订单号是</p>
      <strong id="orderNumber">#1001</strong>
      <p class="modal-total">订单金额：<span id="modalTotal">$0.00</span></p>
      <button id="continueButton" class="primary-button">继续点单</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
